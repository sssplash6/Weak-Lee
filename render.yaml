# Render Blueprint — provisions a Postgres database and the Next.js web service.
# Deploy: push this repo to GitHub, then in Render: New → Blueprint → pick the repo.
databases:
  - name: freshman-weekly-db
    plan: standard
    databaseName: freshman_weekly
    user: freshman

services:
  - type: web
    name: freshman-weekly-tracker
    runtime: node
    plan: free
    # postinstall runs `prisma generate`; we then apply migrations and build.
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /signin
    envVars:
      # Wired automatically from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: freshman-weekly-db
          property: connectionString
      # Auth.js session secret — Render generates a strong random value.
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # Public URL Auth.js uses to build OAuth callback + redirect URLs. Without
      # this, the app guesses from request headers and can pick up Render's
      # internal host (localhost:10000), causing redirect_uri / Configuration
      # errors on sign-in. Must match the domain users actually visit.
      - key: AUTH_URL
        value: "https://www.freshweek.org"
      # One-click test login that BYPASSES real auth (anyone with the URL signs
      # in as a shared test account). Ignored entirely in production builds —
      # src/auth.ts refuses to register the provider when NODE_ENV=production,
      # so setting this here does nothing but log an error. It exists for local
      # and preview builds only; use Google sign-in on the live site.
      - key: ALLOW_DEV_LOGIN
        sync: false
      # Encrypts payee card numbers at rest (lib/cardCrypto.ts). Any
      # high-entropy string — it's hashed to derive the AES key — so Render
      # generating one is fine. Filing a UzCard request is REFUSED while this
      # is unset, rather than falling back to storing the number in the clear.
      # Changing it makes existing stored card numbers unreadable.
      - key: PAYROLL_CARD_KEY
        generateValue: true
      # Optional: fill these in to enable "Continue with Google".
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      # Optional: enables email notifications (daily reports → the recipient)
      # via Resend. Without the key, sends are skipped quietly. RESEND_FROM
      # must be a sender on a domain verified in Resend; defaults to
      # "FreshWeek <reports@freshweek.org>".
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # Optional: ADD extra payroll reviewers (comma-separated emails) on top
      # of the built-ins — admin stage tech@ + shakhzod@, finance stage
      # valera@ (see lib/payroll.ts). Mostly for exercising the queues as a
      # test account; production runs fine with neither set.
      - key: PAYROLL_ADMIN_EMAILS
        sync: false
      - key: PAYROLL_FINANCE_EMAILS
        sync: false
